# ChatNNL dictionary file
# Used by dictionary-mode (DM) and hybrid (ADCM) typo correction.
# Words listed under "words" are treated as valid; words under
# "protected_words" are never corrected.

max_edit_distance: 2
min_word_length: 2
auto_correct: true
corpus_words_are_valid: true
frequency_bonus: 1.0
context_bonus: 2.5
minimum_score: 0.72
maximum_candidates: 5

